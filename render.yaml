# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: musician-finder
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: SEED_COUNT
        value: "60"
